# experiment
run_name: sample_debug
model_key: bert_sample

# data
batch_size: 32
max_length: 128

# model
model_name: bert-base-uncased
dropout: 0.1

# sample-level
exit_layers: [4, 6, 8, 10, 12]
exit_threshold: 0.9
aux_ce_weight: 0.0
distill_weight: 0.0
temperature: 1.0

# train
learning_rate: 2e-5
epochs: 3
seed: 42

# io
output_root: outputs
